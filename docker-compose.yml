services:

  app:
    build: .
    container_name: ai-orchestrator

    ports:
      - "8080:8080"

    depends_on:
      - redis
      - postgres

    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      REDIS_ADDR: redis:6379
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ai_orchestrator?sslmode=disable

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ai-orchestrator-redis

    ports:
      - "6379:6379"

    command: redis-server --appendonly yes

    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: ai-orchestrator-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_orchestrator

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

volumes:
  postgres_data: