services:

  app:
    build: .
    container_name: ai-orchestrator

    ports:
      - "8080:8080"

    depends_on:
      - redis
      - postgres

    environment:
      REDIS_ADDR: redis:6379
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ai_orchestrator?sslmode=disable

    restart: unless-stopped

  redis:
    image: redis:7-alpine

    container_name: ai-orchestrator-redis

    ports:
      - "6379:6379"

    command: redis-server --appendonly yes

    restart: unless-stopped

  postgres:
    image: postgres:16-alpine

    container_name: ai-orchestrator-postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_orchestrator

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

volumes:
  postgres_data: