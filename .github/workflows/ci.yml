name: Go CI

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - "*"

jobs:
  test:

    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379

      postgres:
        image: postgres:16

        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_orchestrator

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      REDIS_ADDR: localhost:6379
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ai_orchestrator?sslmode=disable

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Download dependencies
        run: go mod download

      - name: Verify formatting
        run: |
          test -z "$(gofmt -l .)"

      - name: Run Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Run Tests
        run: go test ./...